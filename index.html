<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thí nghiệm 3D: Phản ứng của nhóm amine (methylamine)</title>
<style>
:root{--bg:#0d1520;--p:#13202f;--p2:#1a2b40;--ln:#27405c;--tx:#e8eef6;--mu:#92a6bd;--ac:#35c2a1;--a2:#f0a04b;--bd:#ef6a6a;--ok:#4cd08a;--lw:246px;--rw:330px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;font-size:13px;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
/* thanh trên */
#top{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(10,18,28,.92);border-bottom:1px solid var(--ln);z-index:7;gap:8px}
#top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:14px}
#top .grp{display:flex;gap:6px;align-items:center;flex-shrink:0}
#top input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:4px 8px;width:140px;font-size:13px}
.sc{background:var(--p2);border:1px solid var(--ln);padding:2px 10px;border-radius:16px;white-space:nowrap;font-size:12.5px}.sc b{color:var(--ac)}
.tg{background:var(--p2);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.tg.on{border-color:var(--ac);color:var(--ac)}.tg:hover{border-color:var(--ac)}
/* bảng hai bên */
.pn{position:fixed;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;z-index:5;transition:transform .25s,opacity .25s}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 10px;border-bottom:1px solid var(--ln);font-weight:700;font-size:13px;gap:6px}
.ph button{padding:1px 8px}
#lp{left:10px;top:50px;width:226px;max-height:calc(100vh - 124px)}
#rp{right:10px;top:50px;width:310px;max-height:calc(100vh - 124px)}
#lp.hid{transform:translateX(-120%);opacity:0;pointer-events:none}#rp.hid{transform:translateX(120%);opacity:0;pointer-events:none}
.hdl{position:fixed;top:56px;z-index:6;display:none;background:rgba(19,32,47,.94);border:1px solid var(--ln);color:var(--ac);padding:8px 7px;font-size:15px}
#hl{left:0;border-radius:0 10px 10px 0;border-left:0}#hr{right:0;border-radius:10px 0 0 10px;border-right:0}
.body{overflow-y:auto;padding:7px 8px;min-height:0;flex:1}
.stp{border:1px solid var(--ln);border-radius:8px;background:#101d2c;padding:5px 8px;margin-bottom:5px;display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.8px;line-height:1.3}
.stp .si{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:11px;flex:none;color:var(--mu)}
.stp.done .si{background:var(--ok);border-color:var(--ok);color:#04231b}.stp.cur{border-color:var(--ac)}.stp.cur .si{border-color:var(--ac);color:var(--ac)}.stp.lock{opacity:.5}.stp.view{background:#16384a}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;background:none;border:0;color:var(--mu);padding:6px 2px;border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
/* thẻ thuyết minh */
#info{position:fixed;top:50px;left:calc(var(--lw) + (100vw - var(--lw) - var(--rw))/2);transform:translateX(-50%);width:min(540px,calc(100vw - var(--lw) - var(--rw) - 24px));min-width:240px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;z-index:5;font-size:12.8px;transition:left .25s,width .25s}
#info.hid{display:none}
#info .ih{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
#info .ih b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#info .ic{padding:1px 8px}
#info .ib{padding:7px 12px 9px;max-height:28vh;overflow-y:auto;line-height:1.55;color:#c9d6e5;border-top:1px solid var(--ln)}
#info.col .ib{display:none}
.eq{margin:5px 0;padding:5px 8px;background:#08111b;border-radius:6px;font-family:Cambria,"Times New Roman",serif;font-size:13.5px;color:#ffe3a8}
.tk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;background:#101d2c;font-size:12.8px}
.tk i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-style:normal;flex:none;font-size:11px}
.tk.ok{border-color:var(--ok)}.tk.ok i{background:var(--ok);border-color:var(--ok);color:#04231b}
.q{border:1px solid var(--ln);border-radius:10px;background:#101d2c;padding:8px;margin-bottom:8px}.q.okq{border-color:var(--ok)}.q.nq{border-color:var(--bd)}
.qh{font-size:11.5px;margin-bottom:3px;color:var(--ac);font-weight:700}.qt{line-height:1.45;margin-bottom:5px;font-size:13px}
.opt{display:block;width:100%;text-align:left;margin:3px 0;background:#0f1b2a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;line-height:1.35;font-size:12.8px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#12362a}.opt.bad{border-color:var(--bd);background:#3a1a1a}
.ex{margin-top:5px;padding:5px 8px;border-radius:7px;font-size:12.3px;line-height:1.5}.ex.g{background:#12362a;color:#bdf0d3}.ex.r{background:#3a1c1c;color:#ffc9c9}
.tfi{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin:5px 0;background:#0f1b2a}.tfi.ok{border-color:var(--ok)}.tfi.bad{border-color:var(--bd)}
.tft{line-height:1.4;margin-bottom:5px;font-size:12.8px}.tfb{display:flex;gap:6px}.tfb button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 14px}
.tfb button.sel{background:var(--ac);color:#03241b;border-color:var(--ac);font-weight:700}.tfb button:disabled{cursor:default}
.tfc{margin-top:6px}.qh .ty{color:var(--mu);font-weight:400;margin-left:6px}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 11px}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03241b;font-weight:700}.btn.warn{border-color:var(--a2);color:var(--a2)}.btn.on{border-color:var(--ac);color:var(--ac)}
#ctrl{position:fixed;left:10px;right:10px;bottom:10px;min-height:46px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5}
#ctrl .sp{flex:1}
#eqb{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);display:none;background:rgba(10,18,28,.94);border:1px solid var(--a2);border-radius:10px;padding:5px 14px;font-family:Cambria,"Times New Roman",serif;font-size:14px;color:#ffe3a8;z-index:5;text-align:center;line-height:1.55}
#toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#0a121c;border:1px solid var(--a2);color:#ffe3a8;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px;z-index:9}
#nogl{position:fixed;left:20%;right:20%;top:45%;text-align:center;color:var(--a2);padding:12px;background:#0a121c;border:1px solid var(--ln);border-radius:10px;z-index:4}
.rs input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:6px 9px;width:100%;margin:4px 0 8px}
.hi{border:1px solid var(--ln);border-radius:8px;padding:5px 8px;margin:5px 0;font-size:12.3px;background:#0f1b2a}
pre{white-space:pre-wrap;background:#08111b;padding:8px;border-radius:8px;font-size:12.3px;margin:6px 0}
@media(max-width:900px){#top input{width:100px}#top .ttl{display:none}#top{justify-content:flex-end}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div class="ttl">Thí nghiệm 3D: Phản ứng của nhóm amine (methylamine)</div>
<div class="grp"><input id="stu" placeholder="Họ tên học sinh" maxlength="40">
<span class="sc" id="ckw" style="display:none"><b id="ck">0</b></span><span class="sc" id="mc" style="display:none"></span><span class="sc">Điểm <b id="sc">0</b>/<span id="mx">16</span></span>
<button class="tg on" id="tgl" title="Ẩn/hiện bảng các bước">☰ Các bước</button><button class="tg on" id="tgi" title="Ẩn/hiện thuyết minh">ⓘ Thuyết minh</button><button class="tg on" id="tgr" title="Ẩn/hiện bảng học tập">📚 Học tập</button><button class="tg" id="tga" title="Ẩn hoặc khôi phục toàn bộ bảng">⛶ Toàn cảnh</button></div></div>
<div id="lp" class="pn"><div class="ph"><span>Các bước</span><button class="btn" id="tl" title="Ẩn bảng">✕</button></div><div class="body" id="stl"></div></div>
<div id="rp" class="pn"><div class="ph"><span>Học tập</span><button class="btn" id="tr" title="Ẩn bảng">✕</button></div>
<div class="tabs"><button data-t="tk" class="on">Nhiệm vụ</button><button data-t="qz">Câu hỏi</button><button data-t="rs">Kết quả</button></div>
<div class="body" id="rb"></div></div>
<div id="info"><div class="ih"><b id="it"></b><button class="btn ic" id="ic" title="Thu gọn / mở rộng">▾</button><button class="btn ic" id="ix" title="Ẩn thuyết minh">✕</button></div><div class="ib" id="ibd"></div></div>
<button class="hdl" id="hl" title="Hiện bảng các bước">☰</button><button class="hdl" id="hr" title="Hiện bảng học tập">📚</button>
<div id="eqb"></div>
<div id="ctrl"></div>
<div id="toast"></div><div id="nogl" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fp=n=>String(Math.round(n*100)/100).replace('.',',');
const KEY='ddhoa-methylamine-v1',HKEY='ddhoa-methylamine-hist',UKEY='ddhoa-methylamine-ui';
let HAS3D=false,booted=false,tm=0,tab='tk',showL=true;

const STEPS=[
{t:'Chuẩn bị',d:'<b>Mục đích:</b> chứng minh methylamine (CH₃NH₂) có tính base yếu; quan sát 4 tính chất: với chất chỉ thị, với acid, với dung dịch muối và với Cu(OH)₂ (tạo phức).<br><b>Hoá chất (đều 0,1 M):</b> dung dịch methylamine, HCl, FeCl₃, CuSO₄; giấy pH hoặc quỳ tím, phenolphthalein.<br><b>Dụng cụ:</b> ống nghiệm, mặt kính đồng hồ, ống nhỏ giọt, giá ống nghiệm.<br><b>An toàn:</b> methylamine có mùi khai, độc, dễ bay hơi: làm nơi thoáng khí, đóng nắp lọ ngay sau khi dùng; đeo kính, găng tay, khẩu trang.',btn:'Đã chuẩn bị, đeo bảo hộ'},
{t:'TN1: Với chất chỉ thị',d:'Nhỏ một giọt methylamine 0,1 M lên mẫu giấy quỳ tím và mẫu giấy pH đặt trên mặt kính đồng hồ. Quỳ tím chuyển từ tím sang xanh; giấy pH chuyển xanh tím, ứng với pH khoảng 11–12. Methylamine nhận H⁺ từ nước, tạo OH⁻ nên dung dịch có môi trường base.<div class="eq">CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻</div>',btn:''},
{t:'TN2: Với dung dịch acid',d:'Cho 2 mL methylamine 0,1 M vào ống 1, thêm 1 giọt phenolphthalein: dung dịch hồng. Nhỏ từ từ 2 mL HCl 0,1 M: màu hồng nhạt dần rồi biến mất vì lượng HCl bằng lượng methylamine, môi trường không còn base.<div class="eq">CH₃NH₂ + HCl → CH₃NH₃Cl</div><i>Lỗi thường gặp: nếu màu hồng chưa mất thì có thể nhỏ HCl chưa đủ hoặc chưa lắc đều.</i>',btn:''},
{t:'TN3: Với dung dịch muối FeCl₃',d:'Cho 1 mL FeCl₃ 0,1 M vào ống 2, rồi thêm khoảng 3 mL methylamine 0,1 M (đúng tỉ lệ 1 : 3). Xuất hiện kết tủa nâu đỏ Fe(OH)₃ vì methylamine tạo OH⁻ trong nước.<div class="eq">3CH₃NH₂ + 3H₂O + FeCl₃ → Fe(OH)₃↓ + 3CH₃NH₃Cl</div><i>Lỗi thường gặp: dung dịch quá loãng hoặc thiếu methylamine thì kết tủa không rõ.</i>',btn:''},
{t:'TN4: Với Cu(OH)₂ (tạo phức)',d:'Cho 2 mL CuSO₄ 0,1 M vào ống 3, thêm từ từ methylamine và lắc đều. Lúc đầu có kết tủa xanh lam nhạt Cu(OH)₂; khi dư methylamine kết tủa tan, thu được dung dịch xanh lam thẫm.<div class="eq">Cu²⁺ + 2CH₃NH₂ + 2H₂O → Cu(OH)₂↓ + 2CH₃NH₃⁺</div><div class="eq">Cu(OH)₂ + 4CH₃NH₂ → [Cu(CH₃NH₂)₄]²⁺ + 2OH⁻</div>Theo hai phương trình, mỗi Cu²⁺ cần 2 + 4 = 6 phân tử methylamine, tức 2 mL CuSO₄ 0,1 M cần khoảng 12 mL methylamine 0,1 M để kết tủa tan hết (mô phỏng nhỏ 3 mL mỗi lần). Trong thực tế cần dư.<br><i>Lỗi thường gặp: kết tủa không tan là do methylamine chưa dư.</i>',btn:''},
{t:'Cấu trúc phức [Cu(CH₃NH₂)₄]²⁺',d:'Camera chuyển sang cảnh phân tử, tự xoay chậm. Ion Cu²⁺ (màu đồng) nằm giữa, liên kết với 4 nguyên tử N của 4 phân tử methylamine, sắp xếp dạng vuông phẳng. Mỗi N dùng cặp electron tự do tạo liên kết cho–nhận với Cu²⁺ (nối màu vàng). Màu nguyên tử: C xám, N xanh dương, H trắng. Mô hình chỉ đơn giản hoá, không đúng tỉ lệ độ dài và góc liên kết.',btn:'Xem cấu trúc phức'},
{t:'Giải thích và kết luận',d:'<b>Kết luận:</b> methylamine là base yếu: đổi màu chất chỉ thị, trung hoà acid, tạo hydroxide kết tủa với muối Fe(III).<br>Methylamine còn tạo phức với Cu²⁺ nhờ cặp electron tự do trên N, giống ammonia. Tính chất này giúp phân biệt với base thông thường như NaOH (NaOH không hoà tan Cu(OH)₂).<br>Nhóm –CH₃ đẩy electron nên methylamine có tính base mạnh hơn ammonia.',btn:'Hoàn thành thí nghiệm'}
];
const TASKS=[
 {t:'Giấy quỳ tím chuyển từ tím sang xanh',k:'a'},
 {t:'Phenolphthalein hoá hồng trong methylamine',k:'b'},
 {t:'Nhỏ đủ HCl: màu hồng biến mất',k:'c'},
 {t:'Thu kết tủa nâu đỏ Fe(OH)₃',k:'d'},
 {t:'Quan sát kết tủa xanh lam Cu(OH)₂',k:'e'},
 {t:'Kết tủa tan hết, dung dịch xanh lam thẫm',k:'f'},
 {t:'Quan sát cấu trúc phức Cu²⁺–methylamine',k:'g'},
 {t:'Hoàn thành giải thích và kết luận',k:'h'}
];
const QZ=[
 {t:'mc',q:'Methylamine có đặc điểm nào cần lưu ý khi làm thí nghiệm?',o:['Mùi khai khó chịu, độc, dễ bay hơi: làm nơi thoáng khí, đóng nắp lọ ngay sau khi dùng.','Không mùi, không độc, có thể để hở lọ.','Không bay hơi nên làm ở đâu cũng được.','Chỉ độc khi đun nóng.'],a:0,x:'Methylamine độc, mùi khai và dễ bay hơi; cần thoáng khí và đồ bảo hộ.'},
 {t:'mc',q:'Nhỏ một giọt methylamine 0,1 M lên giấy quỳ tím, màu giấy thay đổi thế nào?',o:['Từ tím sang xanh.','Từ tím sang đỏ.','Từ xanh sang tím.','Không đổi màu.'],a:0,x:'Methylamine là base yếu, tạo OH⁻ trong nước nên làm quỳ tím hoá xanh.'},
 {t:'mc',q:'Vì sao dung dịch methylamine có môi trường base?',o:['Nhận H⁺ từ nước, tạo CH₃NH₃⁺ và OH⁻.','Nhường H⁺ cho nước, tạo H₃O⁺.','Phân li hoàn toàn thành CH₃⁺ và NH₂⁻.','Phản ứng với O₂ trong không khí.'],a:0,x:'CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻.'},
 {t:'mc',q:'Giấy pH chuyển sang xanh tím khi nhỏ methylamine 0,1 M, ứng với pH khoảng:',o:['11–12','1–2','6–7','13–14'],a:0,x:'Base yếu nên pH khoảng 11–12, thấp hơn dung dịch NaOH 0,1 M (pH khoảng 13).'},
 {t:'mc',q:'Nhỏ 1 giọt phenolphthalein vào dung dịch methylamine, dung dịch có màu:',o:['Hồng','Xanh','Vàng','Không màu'],a:0,x:'Phenolphthalein hoá hồng trong môi trường base.'},
 {t:'mc',q:'Nhỏ HCl 0,1 M vào 2 mL methylamine 0,1 M (có phenolphthalein) đến đủ 2 mL thì màu hồng biến mất vì:',o:['Methylamine đã được trung hoà hết, môi trường không còn base.','HCl phân huỷ phenolphthalein.','Phenolphthalein bay hơi.','Methylamine bị oxi hoá.'],a:0,x:'Lượng HCl bằng lượng methylamine, tạo muối CH₃NH₃Cl nên không còn base.'},
 {t:'mc',q:'Sản phẩm của phản ứng CH₃NH₂ + HCl là:',o:['CH₃NH₃Cl (methylammonium chloride)','CH₃Cl và NH₃','CH₃NH₂Cl₂','CH₄ và NH₄Cl'],a:0,x:'Methylamine nhận H⁺ từ HCl tạo muối CH₃NH₃Cl.'},
 {t:'mc',q:'Cho methylamine vào dung dịch FeCl₃ thu được:',o:['Kết tủa nâu đỏ Fe(OH)₃.','Kết tủa trắng.','Dung dịch xanh lam thẫm.','Khí không màu.'],a:0,x:'OH⁻ do methylamine tạo ra kết hợp với Fe³⁺ thành Fe(OH)₃ nâu đỏ.'},
